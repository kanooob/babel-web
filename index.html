<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Babel Search</title>
  <style>
    :root {
      --bg: #121214;
      --card-bg: #1e1e22;
      --border-color: #2e2e34;
      --text-main: #ffffff;
      --text-muted: #8e8e93;
      --accent: #4a4a52;
      --font: system-ui, -apple-system, sans-serif;
      --mono: ui-monospace, SFMono-Regular, monospace;

      /* Couleurs par défaut (Seront écrasées par JS selon la saison) */
      --c1: #ffffff;
      --c2: #ffffff;
      --c3: #ffffff;
      --c4: #ffffff;
      --c5: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* HEADER */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 28px;
      font-size: 0.9rem;
    }

    .nav-right {
      display: flex;
      gap: 20px;
    }

    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      cursor: pointer;
      transition: color 0.2s;
    }

    .nav-link:hover {
      color: var(--text-main);
    }

    /* MAIN CONTAINER */
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 20px;
      margin-top: -50px;
    }

    /* LOGO DOODLE SAISONNIER */
    .logo-container {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo {
      font-size: 4.8rem;
      font-weight: 800;
      letter-spacing: -1px;
      user-select: none;
    }

    /* Attribution des couleurs dynamic par saison aux lettres */
    .logo span.l1 { color: var(--c1); }
    .logo span.l2 { color: var(--c2); }
    .logo span.l3 { color: var(--c3); }
    .logo span.l4 { color: var(--c4); }
    .logo span.l5 { color: var(--c5); }

    .season-tag {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 4px;
    }

    /* BARRE DE RECHERCHE ET HISTORIQUE */
    .search-box {
      width: 100%;
      max-width: 580px;
      position: relative;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px 18px;
      gap: 12px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-wrapper:focus-within {
      border-color: var(--text-muted);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    /* Arrondir les coins du haut quand l'historique est ouvert */
    .search-box.has-history .input-wrapper {
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
    }

    .search-icon {
      width: 18px;
      height: 18px;
      fill: var(--text-muted);
      flex-shrink: 0;
    }

    input[type="text"] {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 1rem;
      font-family: var(--font);
    }

    /* MENU DEROULANT HISTORIQUE */
    .history-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-top: none;
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
      display: none;
      z-index: 10;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      border-bottom: 1px solid var(--border-color);
    }

    .clear-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      cursor: pointer;
    }

    .clear-btn:hover {
      color: #ff5555;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    .history-item:hover {
      background: var(--bg);
    }

    .history-icon {
      width: 16px;
      height: 16px;
      fill: var(--text-muted);
    }

    .history-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    /* BOUTONS D'ACTION */
    .button-row {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      justify-content: center;
    }

    .btn {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background-color 0.15s, border-color 0.15s;
    }

    .btn:hover {
      background-color: var(--border-color);
    }

    /* PAGE DE RESULTAT */
    .result-container {
      width: 100%;
      max-width: 580px;
      display: none;
    }

    .result-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
    }

    .result-preview {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      word-break: break-all;
    }

    .result-title {
      font-size: 1.3rem;
      color: var(--text-main);
      margin-bottom: 16px;
      font-weight: 600;
    }

    .box {
      background: var(--bg);
      border: 1px solid var(--border-color);
      padding: 14px;
      border-radius: 8px;
      word-break: break-all;
      font-family: var(--mono);
      font-size: 0.9rem;
      color: var(--text-main);
      margin-bottom: 20px;
    }

    .action-stack {
      display: flex;
      gap: 10px;
    }

    /* FOOTER */
    footer {
      padding: 20px 28px;
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      border-top: 1px solid var(--border-color);
    }

    #toast {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 0.88rem;
      transition: transform 0.25s ease, opacity 0.25s ease;
      opacity: 0;
      pointer-events: none;
      z-index: 10;
    }

    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div>Babel Search</div>
    <div class="nav-right">
      <a class="nav-link" onclick="window.location.hash=''">Accueil</a>
      <a class="nav-link" onclick="exploreRandomUrl()">URL Aléatoire</a>
    </div>
  </header>

  <!-- MAIN -->
  <main>
    
    <!-- ACCUEIL -->
    <div id="home-view" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
      
      <!-- LOGO DOODLE AUTOMATIQUE -->
      <div class="logo-container">
        <div class="logo">
          <span class="l1">B</span><span class="l2">a</span><span class="l3">b</span><span class="l4">e</span><span class="l5">l</span>
        </div>
        <div id="season-name" class="season-tag">---</div>
      </div>

      <!-- BARRE DE RECHERCHE + HISTORIQUE -->
      <div class="search-box" id="search-box-container">
        <div class="input-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24">
            <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
          <input type="text" id="search-input" placeholder="Entrer une URL ou une clé Babel..." autocomplete="off" onkeydown="if(event.key==='Enter') searchOrGenerate()">
        </div>

        <!-- DEROULANT HISTORIQUE AU CLIC -->
        <div id="history-dropdown" class="history-dropdown">
          <div class="history-header">
            <span>Recherches récentes</span>
            <button class="clear-btn" onclick="clearHistory(event)">Effacer</button>
          </div>
          <div id="history-list"></div>
        </div>

        <div class="button-row">
          <button class="btn" onclick="searchOrGenerate()">Rechercher</button>
          <button class="btn" onclick="exploreRandomUrl()">Exploration Aléatoire</button>
        </div>
      </div>

    </div>

    <!-- RESULTAT -->
    <div id="result-view" class="result-container">
      <div class="result-card">
        <div class="result-preview" id="decoded-url-preview">https://example.com</div>
        <div class="result-title">Emplacement Babel</div>
        
        <div id="decoded-url-box" class="box">---</div>

        <div class="action-stack">
          <a id="external-btn" class="btn" style="text-decoration: none; display: inline-flex; align-items: center;" href="#" target="_blank" rel="noopener noreferrer">
            Ouvrir l'URL ↗
          </a>
          <button class="btn" onclick="copyCurrentLink()">Copier le lien</button>
          <button class="btn" onclick="window.location.hash=''">← Retour</button>
        </div>
      </div>
    </div>

  </main>

  <!-- FOOTER -->
  <footer>
    <span>La Bibliothèque de Babel — Index Déterministe</span>
    <span>~1 Decillion d'emplacements</span>
  </footer>

  <div id="toast">Lien copié dans le presse-papier !</div>

  <script>
    /* 1. SYSTEME DOODLE PAR SAISON */
    function applySeasonalDoodle() {
      const month = new Date().getMonth() + 1; // 1-12
      const root = document.documentElement;
      const tag = document.getElementById('season-name');

      let season = '';
      let colors = [];

      if (month >= 3 && month <= 5) {
        season = 'Édition Printemps';
        colors = ['#88d498', '#1a936f', '#114b5f', '#f3e9d2', '#c6dabf'];
      } else if (month >= 6 && month <= 8) {
        season = 'Édition Été';
        colors = ['#ffb703', '#fb8500', '#2a9d8f', '#e76f51', '#e9c46a'];
      } else if (month >= 9 && month <= 11) {
        season = 'Édition Automne';
        colors = ['#d62828', '#f77f00', '#fcbf49', '#a44a3f', '#e3a857'];
      } else {
        season = 'Édition Hiver';
        colors = ['#a2d2ff', '#bde0fe', '#ffafcc', '#cdb4db', '#80ed99'];
      }

      tag.innerText = season;
      colors.forEach((col, i) => {
        root.style.setProperty(`--c${i + 1}`, col);
      });
    }

    /* 2. ENCODAGE BASE64 */
    function encodeBase64(str) {
      return btoa(unescape(encodeURIComponent(str)))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function decodeBase64(str) {
      str = str.replace(/-/g, '+').replace(/_/g, '/');
      while (str.length % 4) str += '=';
      return decodeURIComponent(escape(atob(str)));
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    /* 3. HISTORIQUE AU CLIC SUR LA BARRE */
    const searchInput = document.getElementById('search-input');
    const historyDropdown = document.getElementById('history-dropdown');
    const searchBoxContainer = document.getElementById('search-box-container');

    searchInput.addEventListener('focus', showHistory);

    // Fermer quand on clique en dehors
    document.addEventListener('click', (e) => {
      if (!searchBoxContainer.contains(e.target)) {
        hideHistory();
      }
    });

    function addHistory(url, hashKey) {
      let history = JSON.parse(localStorage.getItem('babel_history') || '[]');
      history = history.filter(item => item.hashKey !== hashKey);
      history.unshift({ url, hashKey });
      if (history.length > 5) history.pop();
      localStorage.setItem('babel_history', JSON.stringify(history));
    }

    function showHistory() {
      const history = JSON.parse(localStorage.getItem('babel_history') || '[]');
      const list = document.getElementById('history-list');

      if (history.length === 0) {
        hideHistory();
        return;
      }

      list.innerHTML = history.map(item => `
        <div class="history-item" onclick="loadFromHistory('${item.hashKey}')">
          <svg class="history-icon" viewBox="0 0 24 24">
            <path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/>
          </svg>
          <span class="history-text">${item.url}</span>
        </div>
      `).join('');

      historyDropdown.style.display = 'block';
      searchBoxContainer.classList.add('has-history');
    }

    function hideHistory() {
      historyDropdown.style.display = 'none';
      searchBoxContainer.classList.remove('has-history');
    }

    function clearHistory(e) {
      e.stopPropagation();
      localStorage.removeItem('babel_history');
      hideHistory();
    }

    function loadFromHistory(hashKey) {
      window.location.hash = 'web/' + hashKey;
      hideHistory();
    }

    /* 4. ACTIONS DE RECHERCHE */
    function searchOrGenerate() {
      let query = searchInput.value.trim();
      if (!query) return;

      if (query.includes('#web/')) query = query.split('#web/')[1];

      try {
        const decoded = decodeBase64(query);
        window.location.hash = 'web/' + query;
        return;
      } catch (e) {}

      let formatted = query;
      if (!/^https?:\/\//i.test(formatted)) formatted = 'https://' + formatted;
      const encoded = encodeBase64(formatted);
      window.location.hash = 'web/' + encoded;
    }

    function exploreRandomUrl() {
      const randStr = () => Math.random().toString(36).substring(2, 7);
      const generatedUrl = `https://${randStr()}.${randStr()}`;
      window.location.hash = 'web/' + encodeBase64(generatedUrl);
    }

    function copyCurrentLink() {
      navigator.clipboard.writeText(window.location.href);
      showToast("Lien copié dans le presse-papier !");
    }

    /* 5. ROUTAGE */
    function handleRoute() {
      const hash = window.location.hash;

      if (hash.startsWith('#web/')) {
        const encoded = hash.replace('#web/', '');
        let decoded = '';

        try {
          decoded = decodeBase64(encoded);
        } catch (e) {
          decoded = "[Données non déchiffrables: " + encoded + "]";
        }

        document.getElementById('decoded-url-box').innerText = decoded;
        document.getElementById('decoded-url-preview').innerText = decoded;

        const extBtn = document.getElementById('external-btn');
        if (decoded.startsWith('http://') || decoded.startsWith('https://')) {
          extBtn.href = decoded;
          extBtn.style.display = 'inline-flex';
        } else {
          extBtn.style.display = 'none';
        }

        addHistory(decoded, encoded);

        document.getElementById('home-view').style.display = 'none';
        document.getElementById('result-view').style.display = 'block';

      } else {
        document.getElementById('result-view').style.display = 'none';
        document.getElementById('home-view').style.display = 'flex';
      }
    }

    window.addEventListener('hashchange', handleRoute);
    window.addEventListener('load', () => {
      applySeasonalDoodle();
      handleRoute();
    });
  </script>
</body>
</html>
