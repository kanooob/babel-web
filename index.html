<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internet Babel</title>
  <style>
    :root {
      --bg: #202124;
      --card-bg: #2a2d34;
      --border-color: #5f6368;
      --text-main: #ffffff;
      --text-muted: #9aa0a6;
      --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Consolas, monospace;

      /* Dynamic letter colors */
      --l1: #ffffff;
      --l2: #ffffff;
      --l3: #ffffff;
      --l4: #ffffff;
      --l5: #ffffff;
      --l6: #ffffff;
      --l7: #ffffff;
      --l8: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* MAIN CONTAINER */
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      padding: 20px;
      width: 100%;
    }

    /* LOGO DOODLE WITH SEASONAL & SPECIAL EVENT COLORS */
    .logo-container {
      text-align: center;
      margin-bottom: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      font-size: 5rem;
      font-weight: 800;
      letter-spacing: -2px;
      user-select: none;
      line-height: 1;
      transition: transform 0.3s ease;
      cursor: pointer;
    }

    .logo.mini {
      font-size: 2rem;
      letter-spacing: -1px;
    }

    .logo:hover {
      transform: scale(1.03);
    }

    .logo span { transition: color 0.5s ease; }
    .logo span.l1 { color: var(--l1); }
    .logo span.l2 { color: var(--l2); }
    .logo span.l3 { color: var(--l3); }
    .logo span.l4 { color: var(--l4); }
    .logo span.l5 { color: var(--l5); }
    .logo span.l6 { color: var(--l6); }
    .logo span.l7 { color: var(--l7); }
    .logo span.l8 { color: var(--l8); }

    /* ROUNDED SEARCH BOX */
    .search-box {
      width: 100%;
      max-width: 600px;
      position: relative;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      padding: 10px 20px;
      gap: 12px;
      transition: background 0.2s, box-shadow 0.2s, border-color 0.2s;
    }

    .input-wrapper:hover {
      background: #3c4043;
      border-color: transparent;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.3);
    }

    .input-wrapper:focus-within {
      background: var(--card-bg);
      border-color: #ffffff;
      box-shadow: 0 1px 8px rgba(255, 255, 255, 0.2);
    }

    .search-box.has-history .input-wrapper {
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
    }

    input[type="text"] {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 1.1rem;
      font-weight: 500;
      font-family: var(--font);
    }

    input[type="text"]::placeholder {
      color: var(--text-muted);
      font-weight: 400;
    }

    .action-icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border-radius: 50%;
      color: var(--text-muted);
      transition: background 0.2s, color 0.2s, transform 0.15s ease;
    }

    .action-icon-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.1);
    }

    .action-icon-btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* DICE FACE STYLE */
    .dice-icon {
      font-size: 1.4rem;
      line-height: 1;
      user-select: none;
    }

    .dice-spin {
      animation: spinDice 0.4s ease-out;
    }

    @keyframes spinDice {
      0% { transform: rotate(0deg) scale(0.8); }
      50% { transform: rotate(180deg) scale(1.2); }
      100% { transform: rotate(360deg) scale(1); }
    }

    .clear-input-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border-radius: 50%;
      line-height: 1;
      transition: background 0.2s, color 0.2s;
    }

    .clear-input-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.1);
    }

    /* HISTORY DROPDOWN */
    .history-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-top: none;
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
      display: none;
      z-index: 20;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .clear-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      cursor: pointer;
      border-radius: 12px;
      padding: 2px 8px;
    }

    .clear-btn:hover {
      color: #f28b82;
      background: rgba(242, 139, 130, 0.1);
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      color: var(--text-main);
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    .history-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .history-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    /* NOVO DESIGN DESTINATION HUB (REPLACING GOOGLE SEARCH STYLE) */
    .result-container {
      width: 100%;
      max-width: 720px;
      display: none;
      margin: 10px auto 40px auto;
    }

    .results-top-bar {
      display: flex;
      align-items: center;
      gap: 20px;
      width: 100%;
      margin-bottom: 30px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 20px;
    }

    .destination-hub-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      padding: 32px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .hub-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .hub-site-badge {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .hub-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #3c4043;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .hub-title-box {
      display: flex;
      flex-direction: column;
    }

    .hub-domain-name {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .hub-breadcrumb {
      font-size: 0.85rem;
      color: var(--text-muted);
      word-break: break-all;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 50px;
      background: rgba(52, 168, 83, 0.12);
      border: 1px solid rgba(52, 168, 83, 0.3);
      color: #34a853;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .status-pill-dot {
      width: 6px;
      height: 6px;
      background: #34a853;
      border-radius: 50%;
    }

    /* CODE / TERMINAL DISPLAY BOX */
    .terminal-box {
      background: #17181c;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-family: var(--mono);
      font-size: 0.95rem;
      word-break: break-all;
    }

    .terminal-text {
      color: #e8eaed;
      flex: 1;
    }

    .copy-icon-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .copy-icon-btn:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    /* METRICS GRID */
    .hub-metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .hub-metric-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 16px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .hub-metric-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .hub-metric-value {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-main);
    }

    /* BUTTONS ROW */
    .hub-actions-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 12px 24px;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .btn-primary {
      background-color: #ffffff;
      color: #202124;
      border: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary:hover {
      background-color: #e8eaed;
    }

    /* FOOTER */
    footer {
      width: 100%;
      background: #171717;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.85rem;
      color: var(--text-muted);
      padding: 16px 24px;
    }

    .footer-container {
      display: flex;
      justify-content: center;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
    }

    .footer-metrics {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 0.8rem;
    }

    .metric-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .metric-value {
      color: var(--text-main);
      font-weight: 600;
    }

    #toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 12px 24px;
      border-radius: 50px;
      font-size: 0.88rem;
      transition: transform 0.25s ease, opacity 0.25s ease;
      opacity: 0;
      pointer-events: none;
      z-index: 30;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 650px) {
      .results-top-bar {
        flex-direction: column;
        align-items: flex-start;
      }
      .hub-header {
        flex-direction: column;
        align-items: flex-start;
      }
      .hub-metrics-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <main>
    <!-- HOME VIEW -->
    <div id="home-view" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
      
      <!-- LOGO DOODLE -->
      <div class="logo-container">
        <div class="logo" onclick="window.location.hash=''">
          <span class="l1">I</span><span class="l2">n</span><span class="l3">t</span><span class="l4">e</span><span class="l5">r</span><span class="l6">n</span><span class="l7">e</span><span class="l8">t</span>
        </div>
      </div>

      <!-- SEARCH BOX -->
      <div class="search-box" id="search-box-container">
        <div class="input-wrapper" id="input-wrapper" onclick="focusSearchInput()">
          <input type="text" id="search-input" placeholder="Search a URL..." autocomplete="off" oninput="toggleInputState()" onkeydown="if(event.key==='Enter') searchOrGenerate()">
          
          <button id="dice-btn" class="action-icon-btn" onclick="exploreRandomUrl()" title="I'm Feeling Lucky (Random URL)">
            <span id="dice-face" class="dice-icon">⚄</span>
          </button>

          <button id="clear-input-btn" class="clear-input-btn" onclick="clearSearchInput(event)" title="Clear">✕</button>

          <button class="action-icon-btn" onclick="searchOrGenerate()" title="Search">
            <svg viewBox="0 0 24 24">
              <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
          </button>
        </div>

        <div id="history-dropdown" class="history-dropdown">
          <div class="history-header">
            <span>Recent searches</span>
            <button class="clear-btn" onclick="clearHistory(event)">Clear</button>
          </div>
          <div id="history-list"></div>
        </div>
      </div>

    </div>

    <!-- RESULT VIEW (NEW DESTINATION HUB DESIGN) -->
    <div id="result-view" class="result-container">
      
      <!-- TOP NAVIGATION BAR -->
      <div class="results-top-bar">
        <div class="logo mini" onclick="window.location.hash=''">
          <span class="l1">I</span><span class="l2">n</span><span class="l3">t</span><span class="l4">e</span><span class="l5">r</span><span class="l6">n</span><span class="l7">e</span><span class="l8">t</span>
        </div>
        <div class="search-box" style="max-width: 520px;">
          <div class="input-wrapper" style="padding: 6px 16px;">
            <input type="text" id="result-search-input" placeholder="Search another URL..." autocomplete="off" onkeydown="if(event.key==='Enter') searchFromResults()">
            <button class="action-icon-btn" onclick="searchFromResults()">
              <svg viewBox="0 0 24 24">
                <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- DESTINATION HUB CARD -->
      <div class="destination-hub-card">
        
        <!-- HEADER BADGE -->
        <div class="hub-header">
          <div class="hub-site-badge">
            <div id="res-favicon" class="hub-avatar">B</div>
            <div class="hub-title-box">
              <span id="res-domain" class="hub-domain-name">babel.index</span>
              <span id="res-breadcrumb" class="hub-breadcrumb">https://...</span>
            </div>
          </div>
          <div class="status-pill">
            <span class="status-pill-dot"></span>
            <span>Indexed & Ready</span>
          </div>
        </div>

        <!-- TERMINAL DECODED DISPLAY -->
        <div class="terminal-box">
          <span id="decoded-url-box" class="terminal-text">---</span>
          <button class="copy-icon-btn" onclick="copyDecodedUrl()">Copy Link</button>
        </div>

        <!-- METRICS GRID -->
        <div class="hub-metrics-grid">
          <div class="hub-metric-card">
            <span class="hub-metric-label">Protocol</span>
            <span id="res-protocol" class="hub-metric-value">HTTPS</span>
          </div>
          <div class="hub-metric-card">
            <span class="hub-metric-label">Index Matrix</span>
            <span id="res-hash-id" class="hub-metric-value">Deterministic</span>
          </div>
        </div>

        <!-- ACTION BUTTONS -->
        <div class="hub-actions-row">
          <a id="external-btn" class="btn btn-primary" href="#" target="_blank" rel="noopener noreferrer">
            Open Web Destination ↗
          </a>
          <button class="btn" onclick="copyCurrentLink()">Copy Babel Key</button>
        </div>

      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="footer-container">
      <div class="footer-metrics">
        <div class="metric-item">Index: <span class="metric-value">1 trillion URLs</span></div>
        <div class="metric-item">•</div>
        <div class="metric-item">Total: <span id="total-requests" class="metric-value">...</span></div>
        <div class="metric-item">•</div>
        <div class="metric-item">Today: <span id="daily-requests" class="metric-value">...</span></div>
      </div>
    </div>
  </footer>

  <div id="toast">Link copied to clipboard!</div>

  <script>
    const API_KEY = "url_babel_galaxie_s9";
    const DICE_FACES = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];

    /* DOODLE COLOR PALETTES */
    const DOODLE_THEMES = {
      autumn: ["#e65100", "#f57c00", "#ffb74d", "#d84315", "#ef6c00", "#ff9800", "#ffb74d", "#bf360c"],
      halloween: ["#f57c00", "#9c27b0", "#76ff03", "#ff9800", "#ab47bc", "#64dd17", "#ff6d00", "#8e24aa"],
      winter: ["#00e5ff", "#80deea", "#e0f7fa", "#00b0ff", "#81d4fa", "#b2ebf2", "#40c4ff", "#e0f7fa"],
      christmas: ["#d32f2f", "#388e3c", "#fbc02d", "#e53935", "#43a047", "#fdd835", "#c62828", "#2e7d32"],
      newyear: ["#ffd700", "#e0e0e0", "#ffb300", "#f5f5f5", "#ffc107", "#ffffff", "#ffca28", "#bdbdbd"],
      valentine: ["#e91e63", "#ff4081", "#f48fb1", "#d81b60", "#ff80ab", "#f06292", "#c2185b", "#ff4081"],
      stpatrick: ["#2e7d32", "#4caf50", "#a5d6a7", "#388e3c", "#66bb6a", "#81c784", "#1b5e20", "#43a047"],
      spring: ["#f48fb1", "#81c784", "#ce93d8", "#80cbd3", "#ffb74d", "#a5d6a7", "#f06292", "#b39ddb"],
      summer: ["#ffeb3b", "#00e5ff", "#ff6e40", "#ffd600", "#18ffff", "#ff3d00", "#ffee58", "#00b0ff"],
      classic: ["#ffffff", "#ffffff", "#ffffff", "#ffffff", "#ffffff", "#ffffff", "#ffffff", "#ffffff"]
    };

    function getAutoDoodleTheme() {
      const now = new Date();
      const month = now.getMonth() + 1;
      const day = now.getDate();

      if (month === 10 && day >= 25) return 'halloween';
      if (month === 12 && day >= 20 && day <= 26) return 'christmas';
      if ((month === 12 && day >= 31) || (month === 1 && day <= 2)) return 'newyear';
      if (month === 2 && day === 14) return 'valentine';
      if (month === 3 && day === 17) return 'stpatrick';

      if (month >= 3 && month <= 5) return 'spring';
      if (month >= 6 && month <= 8) return 'summer';
      if (month >= 9 && month <= 11) return 'autumn';
      return 'winter';
    }

    function applyTheme(themeKey) {
      const colors = DOODLE_THEMES[themeKey] || DOODLE_THEMES.classic;
      const root = document.documentElement;

      colors.forEach((col, idx) => {
        root.style.setProperty(`--l${idx + 1}`, col);
      });
    }

    /* BASE64 ENCODING / DECODING */
    function encodeBase64(str) {
      return btoa(unescape(encodeURIComponent(str)))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function decodeBase64(str) {
      str = str.replace(/-/g, '+').replace(/_/g, '/');
      while (str.length % 4) str += '=';
      return decodeURIComponent(escape(atob(str)));
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    /* COUNTERS */
    async function initCounters() {
      try {
        const res = await fetch(`https://countapi.mileshilliard.com/api/v1/hit/${API_KEY}`);
        const data = await res.json();
        document.getElementById('total-requests').innerText = data.value !== undefined ? data.value : '1';
      } catch (e) {
        document.getElementById('total-requests').innerText = '1';
      }

      const today = new Date().toISOString().split('T')[0];
      let dailyData = JSON.parse(localStorage.getItem('babel_daily_count') || '{}');
      if (dailyData.date === today) {
        dailyData.count += 1;
      } else {
        dailyData = { date: today, count: 1 };
      }
      localStorage.setItem('babel_daily_count', JSON.stringify(dailyData));
      document.getElementById('daily-requests').innerText = dailyData.count;
    }

    /* SEARCH & HISTORY UI */
    const searchInput = document.getElementById('search-input');
    const resultSearchInput = document.getElementById('result-search-input');
    const historyDropdown = document.getElementById('history-dropdown');
    const searchBoxContainer = document.getElementById('search-box-container');
    const clearInputBtn = document.getElementById('clear-input-btn');
    const diceBtn = document.getElementById('dice-btn');
    const diceFace = document.getElementById('dice-face');

    function toggleInputState() {
      const hasText = searchInput.value.trim().length > 0;
      diceBtn.style.display = hasText ? 'none' : 'flex';
      clearInputBtn.style.display = hasText ? 'flex' : 'none';
    }

    function focusSearchInput() {
      searchInput.focus();
      showHistory();
    }

    function clearSearchInput(e) {
      e.stopPropagation();
      searchInput.value = '';
      toggleInputState();
      searchInput.focus();
    }

    searchInput.addEventListener('focus', showHistory);

    document.addEventListener('click', (e) => {
      if (!searchBoxContainer.contains(e.target)) {
        hideHistory();
      }
    });

    function addHistory(url, hashKey) {
      let history = JSON.parse(localStorage.getItem('babel_history') || '[]');
      history = history.filter(item => item.hashKey !== hashKey);
      history.unshift({ url, hashKey });
      if (history.length > 5) history.pop();
      localStorage.setItem('babel_history', JSON.stringify(history));
    }

    function showHistory() {
      const history = JSON.parse(localStorage.getItem('babel_history') || '[]');
      const list = document.getElementById('history-list');

      if (history.length === 0) {
        hideHistory();
        return;
      }

      list.innerHTML = history.map(item => `
        <div class="history-item" onclick="loadFromHistory('${item.hashKey}', event)">
          <span class="history-text">${item.url}</span>
        </div>
      `).join('');

      historyDropdown.style.display = 'block';
      searchBoxContainer.classList.add('has-history');
    }

    function hideHistory() {
      historyDropdown.style.display = 'none';
      searchBoxContainer.classList.remove('has-history');
    }

    function clearHistory(e) {
      e.stopPropagation();
      localStorage.removeItem('babel_history');
      hideHistory();
    }

    function loadFromHistory(hashKey, e) {
      e.stopPropagation();
      window.location.hash = 'web/' + hashKey;
      hideHistory();
    }

    /* SEARCH & ROUTING */
    function searchOrGenerate() {
      let query = searchInput.value.trim();
      if (!query) return;

      if (query.includes('#web/')) query = query.split('#web/')[1];

      try {
        decodeBase64(query);
        window.location.hash = 'web/' + query;
        return;
      } catch (e) {}

      let formatted = query;
      if (!/^https?:\/\//i.test(formatted)) formatted = 'https://' + formatted;
      window.location.hash = 'web/' + encodeBase64(formatted);
    }

    function searchFromResults() {
      let query = resultSearchInput.value.trim();
      if (!query) return;

      if (query.includes('#web/')) query = query.split('#web/')[1];

      try {
        decodeBase64(query);
        window.location.hash = 'web/' + query;
        return;
      } catch (e) {}

      let formatted = query;
      if (!/^https?:\/\//i.test(formatted)) formatted = 'https://' + formatted;
      window.location.hash = 'web/' + encodeBase64(formatted);
    }

    function exploreRandomUrl() {
      const randomFace = DICE_FACES[Math.floor(Math.random() * DICE_FACES.length)];
      diceFace.innerText = randomFace;

      diceBtn.classList.remove('dice-spin');
      void diceBtn.offsetWidth;
      diceBtn.classList.add('dice-spin');

      const randStr = () => Math.random().toString(36).substring(2, 7);
      const generatedUrl = `https://${randStr()}.${randStr()}`;
      
      setTimeout(() => {
        window.location.hash = 'web/' + encodeBase64(generatedUrl);
      }, 150);
    }

    function copyCurrentLink() {
      navigator.clipboard.writeText(window.location.href);
      showToast("Babel Key copied to clipboard!");
    }

    function copyDecodedUrl() {
      const urlText = document.getElementById('decoded-url-box').innerText;
      navigator.clipboard.writeText(urlText);
      showToast("URL copied to clipboard!");
    }

    function handleRoute() {
      const hash = window.location.hash;

      if (hash.startsWith('#web/')) {
        const encoded = hash.replace('#web/', '');
        let decoded = '';

        try {
          decoded = decodeBase64(encoded);
        } catch (e) {
          decoded = "[Undecodable data: " + encoded + "]";
        }

        document.getElementById('decoded-url-box').innerText = decoded;
        document.getElementById('res-breadcrumb').innerText = decoded;
        document.getElementById('res-hash-id').innerText = "#" + encoded.substring(0, 10);

        let domain = 'Web Location';
        let initial = 'B';
        let protocol = 'Generic';

        if (decoded.startsWith('http://') || decoded.startsWith('https://')) {
          try {
            const urlObj = new URL(decoded);
            domain = urlObj.hostname;
            initial = domain.replace('www.', '')[0].toUpperCase();
            protocol = urlObj.protocol.replace(':', '').toUpperCase();
          } catch(e) {}
        }

        document.getElementById('res-domain').innerText = domain;
        document.getElementById('res-favicon').innerText = initial;
        document.getElementById('res-protocol').innerText = protocol;

        const extBtn = document.getElementById('external-btn');
        if (decoded.startsWith('http://') || decoded.startsWith('https://')) {
          extBtn.href = decoded;
          extBtn.style.display = 'inline-flex';
        } else {
          extBtn.style.display = 'none';
        }

        addHistory(decoded, encoded);

        document.getElementById('home-view').style.display = 'none';
        document.getElementById('result-view').style.display = 'block';

      } else {
        document.getElementById('result-view').style.display = 'none';
        document.getElementById('home-view').style.display = 'flex';
      }
    }

    window.addEventListener('hashchange', handleRoute);
    window.addEventListener('load', () => {
      applyTheme(getAutoDoodleTheme());
      diceFace.innerText = DICE_FACES[Math.floor(Math.random() * DICE_FACES.length)];
      handleRoute();
      initCounters();
      toggleInputState();
    });
  </script>
</body>
</html>
