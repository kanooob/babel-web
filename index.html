<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internet Babel</title>
  <style>
    :root {
      --bg: #2d3139;
      --card-bg: #21242a;
      --border-color: #ffffff;
      --text-main: #ffffff;
      --text-muted: #a0a5b1;
      --font: system-ui, -apple-system, sans-serif;
      --mono: ui-monospace, SFMono-Regular, monospace;

      --c1: #ffffff;
      --c2: #ffffff;
      --c3: #ffffff;
      --c4: #ffffff;
      --c5: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* MAIN CONTAINER */
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 20px;
    }

    /* LOGO & DOODLE */
    .logo-container {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo {
      font-size: 4.8rem;
      font-weight: 800;
      letter-spacing: -1.5px;
      user-select: none;
      line-height: 1;
    }

    .logo span.l1 { color: var(--c1); }
    .logo span.l2 { color: var(--c2); }
    .logo span.l3 { color: var(--c3); }
    .logo span.l4 { color: var(--c4); }
    .logo span.l5 { color: var(--c5); }

    .season-tag {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 8px;
    }

    /* BARRE DE RECHERCHE */
    .search-box {
      width: 100%;
      max-width: 580px;
      position: relative;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      background: transparent;
      border: 3px solid var(--border-color);
      border-radius: 4px;
      padding: 10px 16px;
      gap: 12px;
      transition: all 0.2s ease;
    }

    .search-box.has-history .input-wrapper {
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
    }

    input[type="text"] {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 1.1rem;
      font-weight: 600;
      font-family: var(--font);
    }

    input[type="text"]::placeholder {
      color: #727782;
      font-weight: 600;
    }

    .action-icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      color: var(--text-main);
      transition: opacity 0.2s;
    }

    .action-icon-btn:hover {
      opacity: 0.7;
    }

    .action-icon-btn svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }

    .clear-input-btn {
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 1.3rem;
      font-weight: bold;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 4px;
      line-height: 1;
    }

    .clear-input-btn:hover {
      opacity: 0.7;
    }

    /* HISTORIQUE DÉROULANT */
    .history-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--card-bg);
      border: 3px solid var(--border-color);
      border-top: none;
      display: none;
      z-index: 20;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.4);
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .clear-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      cursor: pointer;
    }

    .clear-btn:hover {
      color: #ff5555;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      color: var(--text-main);
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    .history-item:hover {
      background: rgba(255,255,255,0.05);
    }

    .history-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    /* RÉSULTATS */
    .result-container {
      width: 100%;
      max-width: 680px;
      display: none;
      margin: 20px 0;
    }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .result-card {
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 8px;
      padding: 28px;
    }

    .result-meta-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .site-favicon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--bg);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: var(--text-main);
    }

    .site-info {
      display: flex;
      flex-direction: column;
    }

    .site-name {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .site-url-breadcrumb {
      font-size: 0.8rem;
      color: var(--text-muted);
      word-break: break-all;
    }

    .result-title-main {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .info-item {
      background: var(--bg);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 12px 14px;
      border-radius: 4px;
    }

    .info-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .info-value {
      font-size: 0.88rem;
      font-weight: 500;
    }

    .url-box {
      background: var(--bg);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 16px;
      border-radius: 4px;
      word-break: break-all;
      font-family: var(--mono);
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    .action-stack {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 18px;
      border-radius: 4px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
    }

    .btn:hover {
      background: rgba(255,255,255,0.1);
    }

    .btn-primary {
      background-color: var(--text-main);
      color: var(--bg);
      border: none;
      font-weight: 600;
    }

    .btn-primary:hover {
      background-color: #d1d1d6;
    }

    /* FOOTER */
    footer {
      width: 100%;
      border-top: 2px solid var(--border-color);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .footer-cell {
      padding: 14px 16px;
      border-right: 1px solid rgba(255,255,255,0.3);
      display: flex;
      align-items: center;
    }

    .footer-cell:last-child {
      border-right: none;
      justify-content: center;
    }

    .footer-cell a {
      color: var(--text-main);
      text-decoration: none;
    }

    #toast {
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 12px 24px;
      border-radius: 4px;
      font-size: 0.88rem;
      transition: transform 0.25s ease, opacity 0.25s ease;
      opacity: 0;
      pointer-events: none;
      z-index: 30;
    }

    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 650px) {
      footer {
        grid-template-columns: 1fr;
      }
      .footer-cell {
        border-right: none;
        border-bottom: 1px solid rgba(255,255,255,0.2);
      }
    }
  </style>
</head>
<body>

  <!-- MAIN -->
  <main>
    
    <!-- ACCUEIL -->
    <div id="home-view" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
      
      <!-- DOODLE SAISONNIER -->
      <div class="logo-container">
        <div class="logo">
          <span class="l1">I</span><span class="l2">n</span><span class="l3">t</span><span class="l4">e</span><span class="l5">rnet</span>
        </div>
        <div id="season-name" class="season-tag">---</div>
      </div>

      <!-- BARRE DE RECHERCHE -->
      <div class="search-box" id="search-box-container">
        <div class="input-wrapper" id="input-wrapper" onclick="focusSearchInput()">
          <input type="text" id="search-input" placeholder="Recherche votre url" autocomplete="off" oninput="toggleInputState()" onkeydown="if(event.key==='Enter') searchOrGenerate()">
          
          <!-- DÉ (AFFICHE QUAND VIDE) -->
          <button id="dice-btn" class="action-icon-btn" onclick="exploreRandomUrl()" title="Exploration Aléatoire">
            <svg viewBox="0 0 24 24">
              <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM7 7c.83 0 1.5.67 1.5 1.5S7.83 10 7 10s-1.5-.67-1.5-1.5S6.17 7 7 7zm0 10c-.83 0-1.5-.67-1.5-1.5S6.17 14 7 14s1.5.67 1.5 1.5S7.83 17 7 17zm5-5c-.83 0-1.5-.67-1.5-1.5S11.17 9 12 9s1.5.67 1.5 1.5S12.83 12 12 12zm5 5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm0-8c-.83 0-1.5-.67-1.5-1.5S16.17 7 17 7s1.5.67 1.5 1.5S17.83 9 17 9z"/>
            </svg>
          </button>

          <!-- CROIX (AFFICHE QUAND TEXTE PRÉSENT) -->
          <button id="clear-input-btn" class="clear-input-btn" onclick="clearSearchInput(event)" title="Effacer">✕</button>

          <!-- LOUPE -->
          <button class="action-icon-btn" onclick="searchOrGenerate()" title="Rechercher">
            <svg viewBox="0 0 24 24">
              <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
          </button>
        </div>

        <!-- HISTORIQUE COLLÉ EN DESSOUS -->
        <div id="history-dropdown" class="history-dropdown">
          <div class="history-header">
            <span>Recherches récentes</span>
            <button class="clear-btn" onclick="clearHistory(event)">Effacer</button>
          </div>
          <div id="history-list"></div>
        </div>
      </div>

    </div>

    <!-- PAGE DE RÉSULTATS -->
    <div id="result-view" class="result-container">
      <div class="result-header">
        <button class="btn" onclick="window.location.hash=''">← Nouvelle recherche</button>
        <span style="font-size: 0.8rem; color: var(--text-muted);">Résultat déterministe Babel</span>
      </div>

      <div class="result-card">
        <div class="result-meta-top">
          <div id="res-favicon" class="site-favicon">B</div>
          <div class="site-info">
            <span id="res-domain" class="site-name">babel.index</span>
            <span id="res-breadcrumb" class="site-url-breadcrumb">https://...</span>
          </div>
        </div>

        <h1 id="res-title" class="result-title-main">Emplacement de destination</h1>

        <div class="info-grid">
          <div class="info-item">
            <div class="info-label">Protocole</div>
            <div id="res-protocol" class="info-value">HTTPS</div>
          </div>
          <div class="info-item">
            <div class="info-label">Statut du lien</div>
            <div id="res-status" class="info-value" style="color: #88d498;">Indexé & Prêt</div>
          </div>
        </div>

        <div class="url-box">
          <span id="decoded-url-box">---</span>
        </div>

        <div class="action-stack">
          <a id="external-btn" class="btn btn-primary" style="text-decoration: none; display: inline-flex; align-items: center;" href="#" target="_blank" rel="noopener noreferrer">
            Visiter la destination ↗
          </a>
          <button class="btn" onclick="copyCurrentLink()">Copier la clé Babel</button>
        </div>
      </div>
    </div>

  </main>

  <!-- FOOTER MAQUETTE -->
  <footer>
    <div class="footer-cell">1 billion d'url</div>
    <div class="footer-cell">requête totale :&nbsp;<span id="total-requests">...</span></div>
    <div class="footer-cell">requête du jour :&nbsp;<span id="daily-requests">...</span></div>
    <div class="footer-cell"><a href="#">Legal</a></div>
  </footer>

  <div id="toast">Lien copié dans le presse-papier !</div>

  <script>
    const API_KEY = "url_babel_galaxie_s9";

    /* DOODLE SAISONNIER */
    function applySeasonalDoodle() {
      const month = new Date().getMonth() + 1;
      const root = document.documentElement;
      const tag = document.getElementById('season-name');

      let season = '';
      let colors = [];

      if (month >= 3 && month <= 5) {
        season = 'Édition Printemps';
        colors = ['#88d498', '#1a936f', '#114b5f', '#f3e9d2', '#c6dabf'];
      } else if (month >= 6 && month <= 8) {
        season = 'Édition Été';
        colors = ['#ffb703', '#fb8500', '#2a9d8f', '#e76f51', '#e9c46a'];
      } else if (month >= 9 && month <= 11) {
        season = 'Édition Automne';
        colors = ['#d62828', '#f77f00', '#fcbf49', '#a44a3f', '#e3a857'];
      } else {
        season = 'Édition Hiver';
        colors = ['#a2d2ff', '#bde0fe', '#ffafcc', '#cdb4db', '#80ed99'];
      }

      tag.innerText = season;
      colors.forEach((col, i) => {
        root.style.setProperty(`--c${i + 1}`, col);
      });
    }

    /* BASE64 */
    function encodeBase64(str) {
      return btoa(unescape(encodeURIComponent(str)))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function decodeBase64(str) {
      str = str.replace(/-/g, '+').replace(/_/g, '/');
      while (str.length % 4) str += '=';
      return decodeURIComponent(escape(atob(str)));
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    /* COMPTEURS */
    async function initCounters() {
      try {
        const res = await fetch(`https://countapi.mileshilliard.com/api/v1/hit/${API_KEY}`);
        const data = await res.json();
        document.getElementById('total-requests').innerText = data.value !== undefined ? data.value : '0';
      } catch (e) {
        document.getElementById('total-requests').innerText = '1';
      }

      const today = new Date().toISOString().split('T')[0];
      let dailyData = JSON.parse(localStorage.getItem('babel_daily_count') || '{}');
      if (dailyData.date === today) {
        dailyData.count += 1;
      } else {
        dailyData = { date: today, count: 1 };
      }
      localStorage.setItem('babel_daily_count', JSON.stringify(dailyData));
      document.getElementById('daily-requests').innerText = dailyData.count;
    }

    /* GESTION ENTRE DÉ ET CROIX */
    const searchInput = document.getElementById('search-input');
    const historyDropdown = document.getElementById('history-dropdown');
    const searchBoxContainer = document.getElementById('search-box-container');
    const clearInputBtn = document.getElementById('clear-input-btn');
    const diceBtn = document.getElementById('dice-btn');

    function toggleInputState() {
      const hasText = searchInput.value.trim().length > 0;
      if (hasText) {
        diceBtn.style.display = 'none';
        clearInputBtn.style.display = 'flex';
      } else {
        diceBtn.style.display = 'flex';
        clearInputBtn.style.display = 'none';
      }
    }

    function focusSearchInput() {
      searchInput.focus();
      showHistory();
    }

    function clearSearchInput(e) {
      e.stopPropagation();
      searchInput.value = '';
      toggleInputState();
      searchInput.focus();
    }

    searchInput.addEventListener('focus', showHistory);

    document.addEventListener('click', (e) => {
      if (!searchBoxContainer.contains(e.target)) {
        hideHistory();
      }
    });

    function addHistory(url, hashKey) {
      let history = JSON.parse(localStorage.getItem('babel_history') || '[]');
      history = history.filter(item => item.hashKey !== hashKey);
      history.unshift({ url, hashKey });
      if (history.length > 5) history.pop();
      localStorage.setItem('babel_history', JSON.stringify(history));
    }

    function showHistory() {
      const history = JSON.parse(localStorage.getItem('babel_history') || '[]');
      const list = document.getElementById('history-list');

      if (history.length === 0) {
        hideHistory();
        return;
      }

      list.innerHTML = history.map(item => `
        <div class="history-item" onclick="loadFromHistory('${item.hashKey}', event)">
          <span class="history-text">${item.url}</span>
        </div>
      `).join('');

      historyDropdown.style.display = 'block';
      searchBoxContainer.classList.add('has-history');
    }

    function hideHistory() {
      historyDropdown.style.display = 'none';
      searchBoxContainer.classList.remove('has-history');
    }

    function clearHistory(e) {
      e.stopPropagation();
      localStorage.removeItem('babel_history');
      hideHistory();
    }

    function loadFromHistory(hashKey, e) {
      e.stopPropagation();
      window.location.hash = 'web/' + hashKey;
      hideHistory();
    }

    /* RECHERCHE ET NAVIGATION */
    function searchOrGenerate() {
      let query = searchInput.value.trim();
      if (!query) return;

      if (query.includes('#web/')) query = query.split('#web/')[1];

      try {
        const decoded = decodeBase64(query);
        window.location.hash = 'web/' + query;
        return;
      } catch (e) {}

      let formatted = query;
      if (!/^https?:\/\//i.test(formatted)) formatted = 'https://' + formatted;
      const encoded = encodeBase64(formatted);
      window.location.hash = 'web/' + encoded;
    }

    function exploreRandomUrl() {
      const randStr = () => Math.random().toString(36).substring(2, 7);
      const generatedUrl = `https://${randStr()}.${randStr()}`;
      window.location.hash = 'web/' + encodeBase64(generatedUrl);
    }

    function copyCurrentLink() {
      navigator.clipboard.writeText(window.location.href);
      showToast("Lien copié dans le presse-papier !");
    }

    /* ROUTAGE */
    function handleRoute() {
      const hash = window.location.hash;

      if (hash.startsWith('#web/')) {
        const encoded = hash.replace('#web/', '');
        let decoded = '';

        try {
          decoded = decodeBase64(encoded);
        } catch (e) {
          decoded = "[Données non déchiffrables: " + encoded + "]";
        }

        document.getElementById('decoded-url-box').innerText = decoded;
        document.getElementById('res-breadcrumb').innerText = decoded;

        let domain = 'Emplacement Web';
        let initial = 'B';
        let protocol = 'Générique';

        if (decoded.startsWith('http://') || decoded.startsWith('https://')) {
          try {
            const urlObj = new URL(decoded);
            domain = urlObj.hostname;
            initial = domain.replace('www.', '')[0].toUpperCase();
            protocol = urlObj.protocol.replace(':', '').toUpperCase();
          } catch(e) {}
        }

        document.getElementById('res-domain').innerText = domain;
        document.getElementById('res-title').innerText = domain !== 'Emplacement Web' ? `Destination : ${domain}` : 'Résultat d\'emplacement Babel';
        document.getElementById('res-favicon').innerText = initial;
        document.getElementById('res-protocol').innerText = protocol;

        const extBtn = document.getElementById('external-btn');
        if (decoded.startsWith('http://') || decoded.startsWith('https://')) {
          extBtn.href = decoded;
          extBtn.style.display = 'inline-flex';
        } else {
          extBtn.style.display = 'none';
        }

        addHistory(decoded, encoded);

        document.getElementById('home-view').style.display = 'none';
        document.getElementById('result-view').style.display = 'block';

      } else {
        document.getElementById('result-view').style.display = 'none';
        document.getElementById('home-view').style.display = 'flex';
      }
    }

    window.addEventListener('hashchange', handleRoute);
    window.addEventListener('load', () => {
      applySeasonalDoodle();
      handleRoute();
      initCounters();
      toggleInputState();
    });
  </script>
</body>
</html>
